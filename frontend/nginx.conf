server {
    listen 80;
    server_name localhost;

    # The directory where our built React HTML, CSS, and JS files live
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression: shrinks file sizes before sending them over the internet
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ==============================================================================
    # Single Page Application (SPA) Rule (VERY IMPORTANT FOR INTERVIEWS)
    #
    # When a user visits "eventora.com/discover" directly:
    # 1. Nginx checks if a real file called "/discover" exists ($uri)
    # 2. Checks if a real folder called "/discover" exists ($uri/)
    # 3. If neither exists, it sends back "/index.html" so React Router can render the page!
    # Without this rule, visiting any URL directly would show a "404 Not Found" error.
    # ==============================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Browser Caching: tell the browser to keep images, JS, and CSS in cache for 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
