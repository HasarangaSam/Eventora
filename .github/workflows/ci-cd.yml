# ==============================================================================
# GitHub Actions CI/CD Pipeline
#
# This file runs automatically on GitHub whenever:
# 1. Someone opens a Pull Request to 'main'
# 2. Someone merges code into 'main'
# ==============================================================================

name: Eventora CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: Continuous Integration (CI) - Automated Checks & Testing
  # ----------------------------------------------------------------------------
  test-and-lint:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository code
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Step 2: Install Node.js version 22
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Step 3: Backend checks
      - name: Backend - Install dependencies
        working-directory: ./backend
        run: npm install

      - name: Backend - Validate Prisma database schema
        working-directory: ./backend
        run: npx prisma validate

      - name: Backend - Run Linter (Oxlint)
        working-directory: ./backend
        run: npm run lint

      - name: Backend - Run Unit & Integration Tests (Vitest)
        working-directory: ./backend
        run: npm run test

      # Step 4: Frontend checks
      - name: Frontend - Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Frontend - Run Linter
        working-directory: ./frontend
        run: npm run lint

      - name: Frontend - Test Build (TypeScript + Vite)
        working-directory: ./frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # JOB 2: Continuous Deployment (CD) - Triggered ONLY when code merges to 'main'
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test-and-lint # Only run if tests pass!
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # STEP A: Apply any new database schema changes safely before the app updates
      - name: Run Prisma Database Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm install
          npx prisma migrate deploy

      # STEP B: Trigger hosting deployment (e.g. Render, Railway, or Vercel webhook)
      - name: Trigger Production Deployment
        run: |
          echo "All tests passed and migrations deployed successfully!"
          echo "Ready for zero-downtime deployment."
